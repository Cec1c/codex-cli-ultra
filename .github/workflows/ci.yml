name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          components: rustfmt
      - run: npm ci
      - name: Verify stable multiplatform Release contract
        run: node --test test/workflow-sync-channel.test.mjs
      - run: npm test
      - run: npm run build
      - name: Fetch fork source for visible-text audit
        run: git clone --filter=blob:none --depth 1 https://github.com/Cec1c/codex.git .upstream/codex
      - name: Verify deterministic visible-text audit twice
        shell: pwsh
        run: |
          $first = npm run -s text:audit -- .upstream/codex | ConvertFrom-Json
          $second = npm run -s text:audit -- .upstream/codex | ConvertFrom-Json
          if ($first.sha256 -ne $second.sha256) {
            throw 'visible-text audit is not deterministic'
          }
      - name: Verify Rust manager TUI
        working-directory: tui
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo build --release --locked

  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          components: rustfmt
      - run: npm ci
      - name: Verify cross-platform runtime contracts
        run: node --test test/platform.test.mjs test/installer/posix-path.test.mjs test/install-script.test.mjs test/update-upgrade.test.mjs
      - run: npm run build
      - name: Verify Rust manager TUI
        working-directory: tui
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo build --release --locked
