[package]
name = "ccu-manager"
version = "0.2.0-alpha.7"
edition = "2024"
description = "Codex CLI Ultra Manager Next TUI"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
